services:
  - type: web
    name: asha-vaani-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: MOCK_GNANI
        value: "false"
      - key: GNANI_API_KEY
        sync: false
      - key: GNANI_STT_WS_URL
        value: "wss://api.vachana.ai/stt/v3/stream"
      - key: GNANI_TTS_WS_URL
        value: "wss://api.vachana.ai/api/v1/tts"
      - key: LLM_PROVIDER
        value: "groq"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: "qwen/qwen3.8-27b"
      - key: VAD_SILENCE_TAIL_MS
        value: "850"
      - key: DATABASE_URL
        value: "sqlite+aiosqlite:///asha_visits.db"

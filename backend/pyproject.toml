[project]
name = "asha-vaani-backend"
version = "0.1.0"
description = "ASHA Vaani Voice Field Register Backend Orchestrator (Gnani Voice Hackathon)"
readme = "README.md"
authors = [
    { name = "Poorna959", email = "1si25cs165@sit.ac.in" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.165.0",
    "google-genai>=3.6.1",
    "httpx>=0.28.1",
    "numpy>=2.5.5",
    "onnxruntime>=1.32.0",
    "openpyxl>=3.1.5",
    "pydantic-settings>=2.16.3",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
